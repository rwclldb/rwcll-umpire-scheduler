name: Keep Supabase awake

# Calls the keep_alive() database function once a day so the free-plan
# Supabase project does not pause from inactivity.
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_URL              e.g. https://your-project-ref.supabase.co
#   SUPABASE_PUBLISHABLE_KEY  the project's publishable key
# The job uses no third-party actions and needs no repository access.

on:
  schedule:
    - cron: "17 14 * * *"   # every day at 14:17 UTC
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call keep_alive()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "Missing repository secret SUPABASE_URL or SUPABASE_PUBLISHABLE_KEY." >&2
            exit 1
          fi
          echo "Calling keep_alive() ..."
          curl --fail-with-body --silent --show-error --max-time 30 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/keep_alive" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
          echo
          echo "Done."
